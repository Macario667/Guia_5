
# Configuración general
quarkus.http.port=8080

# Jackson: serialización sin reflexión (TECH PREVIEW)
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=true

# Multipart: tamaño máximo de cada parte
quarkus.http.limits.max-form-attribute-size=2048

# Log de parámetros (debug cuando algo falla con 400)
quarkus.log.category."org.jboss.resteasy.reactive.server.handlers.ParameterHandler".level=DEBUG